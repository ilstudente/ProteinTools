[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-structure-detective"
version = "0.1.0"
description = "Frozen-data protein tool-use benchmark with SFT, GRPO, Modal and W&B"
requires-python = ">=3.11"
dependencies = ["requests==2.34.2", "wandb==0.25.0", "modal==1.3.5"]

[project.optional-dependencies]
train = ["torch==2.10.0", "transformers==5.2.0", "trl==0.28.0", "peft==0.18.1", "datasets==4.5.0", "accelerate==1.12.0"]
dev = ["pytest>=8,<10"]
dashboard = ["wandb-workspaces==0.3.10"]

[project.scripts]
protein-detective = "protein_detective.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
